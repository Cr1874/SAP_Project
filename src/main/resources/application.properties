spring.application.name=Notio
server.port=8080

# SQLite database file, created in the project folder
spring.datasource.url=jdbc:sqlite:notio.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite allows one writer at a time, so use one connection
spring.datasource.hikari.maximum-pool-size=1

# Run schema.sql on every start
spring.sql.init.mode=always

# Logging: also write the log to logs/notio.log 
logging.file.name=logs/notio.log