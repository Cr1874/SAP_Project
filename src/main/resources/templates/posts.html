<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Posts Notio</title>
  <meta name="description" content="Browse and search Notio posts">
</head>
<body>
<header>
  <p>Logged in as <strong sec:authentication="name">user</strong></p>
  <a th:href="@{/posts/new}">New post</a>
  <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Admin</a>
  <form th:action="@{/logout}" method="post">
    <button type="submit">Log out</button>
  </form>
</header>

<main>
  <h1>Notio</h1>
  <p id="flash" role="status"></p>

  <form th:action="@{/posts}" method="get" role="search">
    <label for="q">Search posts</label>
    <input id="q" name="q" type="search" th:value="${param.q}">
    <button type="submit">Search</button>
  </form>

  <p th:if="${param.q}">You searched for: <span th:text="${param.q}"></span></p>
  <p th:if="${#lists.isEmpty(posts)}">No posts found.</p>

  <article th:each="post : ${posts}">
    <h2 th:text="${post.title}">Title</h2>
    <p th:text="${post.body}">Body</p>
    <p><small>By <span th:text="${post.authorUsername}"></span>
      on <span th:text="${post.createdAt}"></span></small></p>
    <a th:if="${post.authorUsername == #authentication.name}"
       th:href="@{/posts/{id}/edit(id=${post.id})}">Edit</a>
  </article>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
