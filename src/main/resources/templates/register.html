<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register for Notio</title>
  <meta name="description" content="Create a Notio account">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main>
  <h1>Create an account</h1>

  <form th:action="@{/register}" th:object="${form}" method="post">
    <label for="username">Username</label>
    <input id="username" type="text" th:field="*{username}" required>
    <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>

    <label for="email">Email</label>
    <input id="email" type="email" th:field="*{email}" required>
    <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

    <label for="password">Password</label>
    <input id="password" type="password" th:field="*{password}" required>
    <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

    <label for="confirmPassword">Confirm password</label>
    <input id="confirmPassword" type="password" th:field="*{confirmPassword}" required>
    <p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>

    <button type="submit">Register</button>
  </form>
  <p><a th:href="@{/login}">Back to log in</a></p>
</main>
</body>
</html>
